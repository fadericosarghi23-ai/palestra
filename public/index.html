<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-180.png">
<title>starfit+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: banda nera di navigazione + hero nero, pagina grigio acciaio, schede esercizio con pannello animazione nero.
   Proporzioni: 60% grigio acciaio · 30% nero ferro · 10% rosso fuoco */
:root {
  --steel: #A3ACB4;
  --steel-light: #BDC4CA;
  --steel-line: #8A949C;
  --iron: #1B1D20;
  --iron-2: #25282C;
  --iron-3: #33373C;
  --fire: #E0321B;
  --fire-bright: #FF5233;
  --ink: #111316;
  --ink-muted: #353C43;
  --on-iron: #E7EAED;
  --on-iron-muted: #A0A8AF;
  --fig: #ECEFF1;
  --fig-far: #6E7780;
  --prop: #98A1A9;
  --prop-soft: #3A3F45;
  --floor: #2A2E33;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--steel); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--iron); z-index: 30; }
img, svg { max-width: 100%; }
a { color: inherit; }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--fire-bright); outline-offset: 2px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- Testata ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--iron); color: var(--on-iron); border-bottom: 3px solid var(--fire); }
.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 56px; }
.brand { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; text-decoration: none; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.brand i { display: inline-block; width: 22px; height: 10px; background: var(--fire); transform: skewX(-24deg); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; text-decoration: none; color: var(--on-iron-muted); padding: 16px 10px 13px; border-bottom: 3px solid transparent; margin-bottom: -3px; white-space: nowrap; }
.tabs a:hover { color: var(--on-iron); }
.tabs a[aria-current="page"] { color: var(--on-iron); border-bottom-color: var(--fire-bright); }
.tabs .sep { width: 1px; background: var(--iron-3); margin: 14px 6px; flex: none; }
.slow { flex: none; display: flex; align-items: center; gap: 8px; background: var(--iron-2); color: var(--on-iron); border: 1px solid var(--iron-3); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
.slow .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--iron-3); border: 1px solid var(--on-iron-muted); }
.slow[aria-pressed="true"] .dot { background: var(--fire-bright); border-color: var(--fire-bright); }

/* ---------- Hero ---------- */
.hero { background: var(--iron); color: var(--on-iron); overflow: hidden; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-block: 40px 36px; }
.eyebrow { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .14em; font-size: 14px; color: var(--fire-bright); margin: 0 0 8px; }
.hero h1 { font-family: var(--display); font-weight: 800; font-style: italic; text-transform: uppercase; font-size: clamp(52px, 9vw, 104px); line-height: .88; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.hero h1 span { color: var(--fire-bright); }
.lede { font-size: 18px; color: var(--on-iron-muted); max-width: 52ch; margin: 18px 0 24px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.stat b { display: block; font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--on-iron-muted); text-transform: uppercase; letter-spacing: .08em; }
.stat.hot b { color: var(--fire-bright); }
.hero-fig { position: relative; aspect-ratio: 240 / 220; max-width: 440px; width: 100%; justify-self: center; }
.hero-fig::before { content: ""; position: absolute; left: -12%; right: 40%; top: 30%; height: 44%; background: repeating-linear-gradient(180deg, transparent 0 14px, rgba(224, 50, 27, .55) 14px 17px); transform: skewX(-24deg); opacity: .7; }
.hero-fig svg { position: relative; width: 100%; height: auto; display: block; }

/* ---------- Sezioni ---------- */
main { padding-block: 32px 64px; }
.sec { margin-bottom: 44px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 16px; }
h2 { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 34px; line-height: 1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.kicker { font-size: 15px; color: var(--ink-muted); margin: 0; }
.btn-ghost { background: transparent; border: 1.5px solid var(--ink); color: var(--ink); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn-ghost:hover { background: var(--ink); color: var(--steel); }

/* Settimana */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.day-tile { display: flex; flex-direction: column; gap: 8px; text-decoration: none; background: var(--steel-light); border: 1px solid var(--steel-line); border-radius: 12px; padding: 14px 14px 12px; min-height: 172px; position: relative; transition: transform .15s ease, border-color .15s ease; }
.day-tile:hover { transform: translateY(-2px); border-color: var(--ink); }
.day-tile .dn { font-family: var(--display); font-weight: 800; font-size: 26px; text-transform: uppercase; line-height: 1; }
.day-tile .tt { font-weight: 600; font-size: 14px; line-height: 1.3; flex: 1; }
.day-tile.today { border: 2px solid var(--fire); }
.today-tag { position: absolute; top: -10px; right: 10px; background: var(--fire); color: #fff; font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: .08em; padding: 2px 8px; border-radius: 4px; }
.md { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .06em; font-variant-numeric: tabular-nums; color: var(--ink-muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; padding: 3px 9px; border-radius: 4px; background: var(--iron); color: var(--on-iron); width: fit-content; }
.chip.gym::before, .chip.act::before, .chip.match::before, .chip.field::before { content: ""; width: 7px; height: 7px; border-radius: 50%; }
.chip.gym::before { background: var(--fire-bright); }
.chip.act::before { background: var(--on-iron); }
.chip.field::before { background: var(--on-iron-muted); }
.chip.match::before { background: var(--fire-bright); box-shadow: 0 0 0 2px var(--iron), 0 0 0 3px var(--fire-bright); }
.prog { height: 6px; background: var(--steel); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--fire); border-radius: 3px; }
.prog-l { font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }

.pillars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pillar { background: var(--iron); color: var(--on-iron); border-radius: 12px; padding: 20px; }
.pillar h3 { font-family: var(--display); font-weight: 800; font-style: italic; text-transform: uppercase; font-size: 28px; margin: 0 0 6px; }
.pillar h3 span { color: var(--fire-bright); }
.pillar p { margin: 0; color: var(--on-iron-muted); font-size: 15px; }
.note { border-left: 4px solid var(--fire); padding: 10px 16px; background: var(--steel-light); border-radius: 0 8px 8px 0; font-size: 15px; max-width: 75ch; }

/* Testata del giorno */
.dayhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 32px; align-items: end; margin-bottom: 28px; }
.dayhead .big { font-family: var(--display); font-weight: 800; font-style: italic; text-transform: uppercase; font-size: clamp(44px, 7vw, 76px); line-height: .9; margin: 6px 0 4px; }
.dayhead .sub { font-family: var(--display); font-weight: 700; font-size: 24px; text-transform: uppercase; margin: 0; }
.dayhead .goal { max-width: 62ch; margin: 10px 0 0; color: var(--ink-muted); font-size: 17px; }
.meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.dur { background: var(--iron); color: var(--on-iron); border-radius: 12px; padding: 14px 18px; text-align: center; min-width: 120px; }
.dur b { display: block; font-family: var(--display); font-weight: 800; font-size: 38px; line-height: 1; color: var(--fire-bright); font-variant-numeric: tabular-nums; }
.dur span { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--on-iron-muted); }
.mob-link { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; background: var(--iron); color: var(--on-iron); border-radius: 12px; padding: 14px 18px; margin-bottom: 28px; }
.mob-link b { font-family: var(--display); font-size: 20px; text-transform: uppercase; }
.mob-link span { color: var(--on-iron-muted); font-size: 14px; }
.mob-link em { font-style: normal; color: var(--fire-bright); font-weight: 700; white-space: nowrap; }
.block-h { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 22px; display: flex; align-items: center; gap: 12px; margin: 30px 0 14px; }
.block-h::after { content: ""; flex: 1; height: 2px; background: var(--steel-line); }

/* Schede esercizio */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; align-items: start; }
.ex { background: var(--steel-light); border: 1px solid var(--steel-line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.ex.is-done { border-color: var(--fire); }
.anim { position: relative; background: var(--iron); overflow: hidden; }
.anim svg { display: block; width: 100%; height: auto; max-height: 300px; overflow: visible; }
.pp { position: absolute; right: 10px; top: 10px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--iron-3); background: var(--iron-2); color: var(--on-iron); display: grid; place-items: center; cursor: pointer; }
.pp:hover { border-color: var(--fire-bright); }
.pp svg { width: 14px; height: 14px; }
.view-tag { position: absolute; left: 10px; top: 10px; font-family: var(--display); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--on-iron-muted); }
.ex-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ex-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.cat { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: 12px; color: var(--ink-muted); margin: 0; }
.ex h3 { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.05; text-transform: uppercase; margin: 2px 0 0; text-wrap: balance; }
.done { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; user-select: none; }
.done input { width: 18px; height: 18px; accent-color: var(--fire); margin: 0; }
.dose { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; background: var(--iron); color: var(--on-iron); border-radius: 8px; padding: 8px 12px; }
.dose .sets { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; color: var(--fire-bright); font-variant-numeric: tabular-nums; }
.dose .per, .dose .rest { font-size: 14px; color: var(--on-iron-muted); }
.dose .rest b { color: var(--on-iron); font-weight: 600; }
.ex .note-l { margin: 0; font-weight: 600; font-size: 15px; }
.ex h4 { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 14px; margin: 4px 0 0; }
.ex ol, .ex ul { margin: 0; padding-left: 20px; font-size: 15px; display: grid; gap: 4px; }
.ex ol li::marker { font-family: var(--display); font-weight: 800; color: var(--fire); }
.ex ul.err { list-style: none; padding-left: 0; }
.ex ul.err li { padding-left: 22px; position: relative; }
.ex ul.err li::before { content: ""; position: absolute; left: 2px; top: 6px; width: 12px; height: 12px; background: linear-gradient(45deg, transparent 44%, var(--fire) 44% 56%, transparent 56%), linear-gradient(-45deg, transparent 44%, var(--fire) 44% 56%, transparent 56%); }
.ex-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--steel-line); }
.mus { display: flex; flex-wrap: wrap; gap: 6px; }
.mus span { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--steel-line); background: var(--steel); }
.yt { font-weight: 700; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; border-bottom: 2px solid var(--fire); padding-bottom: 1px; }
.yt:hover { color: var(--fire); }
.where { font-size: 13px; color: var(--ink-muted); }
.where b { color: var(--ink); }

/* Video e interruttore */
.media-sw { position: absolute; left: 10px; top: 10px; z-index: 3; display: flex; background: var(--iron-2); border: 1px solid var(--iron-3); border-radius: 999px; padding: 2px; }
.media-sw button { border: 0; background: transparent; color: var(--on-iron-muted); font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.media-sw button[aria-pressed="true"] { background: var(--fire); color: #fff; }
.anim:has(.media-sw) .view-tag { top: auto; bottom: 26px; }
.vid { position: relative; aspect-ratio: 16 / 9; background: #000; }
.vid iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.vid-play { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: #000; cursor: pointer; display: block; }
.vid-play img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .82; }
.vid-play:hover img { opacity: 1; }
.vid-btn { position: absolute; left: 50%; top: 50%; width: 64px; height: 44px; margin: -22px 0 0 -32px; border-radius: 12px; background: var(--fire); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 18px rgba(0, 0, 0, .45); }
.vid-btn svg { width: 18px; height: 18px; }
.vid-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 12px 8px; background: linear-gradient(transparent, rgba(0, 0, 0, .8)); color: var(--on-iron); font-size: 12px; text-align: left; }

/* Calendario */
.cal-status { font-size: 18px; margin: 0 0 12px; }
.cal-status b { color: var(--fire); }
.cal { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; }
.wk { background: var(--steel-light); border: 1px solid var(--steel-line); border-radius: 8px; padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.wk-n { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; }
.wk-d { font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.wk-t { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.wk.deload { border-style: dashed; }
.wk.past { background: var(--iron); color: var(--on-iron); border-color: var(--iron); }
.wk.past .wk-d { color: var(--on-iron-muted); }
.wk.now { border: 2px solid var(--fire); box-shadow: 0 0 0 3px rgba(224, 50, 27, .18); }
.wk.now .wk-n { color: var(--fire); }
@media (max-width: 1000px) { .cal { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
@media (max-width: 520px) { .cal { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* Serie e recupero sulle schede */
.setbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.dots { display: flex; align-items: center; gap: 5px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--iron); background: transparent; }
.dots i.on { background: var(--fire); border-color: var(--fire); }
.dots-l { font-size: 13px; font-weight: 700; margin-left: 4px; font-variant-numeric: tabular-nums; }
.sb-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.sb-btn { border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; cursor: pointer; background: var(--fire); color: #fff; }
.sb-btn:hover { background: #c42813; }
.sb-hold { background: var(--iron); color: var(--on-iron); }
.sb-hold:hover { background: var(--iron-3); }
.sb-undo { border: 1.5px solid var(--ink); background: transparent; border-radius: 999px; width: 36px; height: 36px; font-size: 16px; cursor: pointer; color: var(--ink); }
.sw-open { flex: none; display: flex; align-items: center; gap: 6px; background: var(--fire); color: #fff; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 700; }
.sw-open svg { width: 15px; height: 15px; }

/* Barra timer in basso */
body.has-timer main { padding-bottom: 150px; }
.timer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--iron); color: var(--on-iron); border-top: 3px solid var(--fire); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -8px 30px rgba(0, 0, 0, .35); }
.t-prog { height: 5px; background: var(--iron-3); }
.t-prog i { display: block; height: 100%; width: 0; background: var(--fire-bright); transition: width .1s linear; }
.t-in { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 8px 20px; padding-block: 10px 12px; }
.t-info { display: flex; flex-direction: column; min-width: 0; }
.t-kind { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .1em; font-size: 14px; color: var(--fire-bright); }
.t-label { font-size: 14px; color: var(--on-iron-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-time { font-family: var(--display); font-weight: 800; font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .01em; min-width: 3.2ch; text-align: center; }
.t-ctrl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.t-ctrl button { border: 1px solid var(--iron-3); background: var(--iron-2); color: var(--on-iron); border-radius: 999px; padding: 9px 13px; font-weight: 700; font-size: 14px; cursor: pointer; font-variant-numeric: tabular-nums; }
.t-ctrl button:hover { border-color: var(--on-iron-muted); }
.t-ctrl .t-main { background: var(--fire); border-color: var(--fire); color: #fff; min-width: 96px; }
.t-ctrl .t-x { width: 40px; padding: 9px 0; }
.timer .t-sw { display: none; }
.timer.is-sw .t-sw { display: inline-block; }
.timer.is-sw .t-adj { display: none; }
.timer.is-done .t-time { color: var(--fire-bright); animation: t-blink .8s steps(2) infinite; }
@keyframes t-blink { 50% { opacity: .35; } }
.t-laps { display: flex; flex-wrap: wrap; gap: 6px 16px; padding-block: 0 10px; font-size: 13px; color: var(--on-iron-muted); font-variant-numeric: tabular-nums; }
.t-laps b { color: var(--on-iron); }
.t-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0; }
@media (max-width: 760px) {
  .t-in { grid-template-columns: minmax(0, 1fr) auto; }
  .t-ctrl { grid-column: 1 / -1; justify-content: stretch; }
  .t-ctrl button { flex: 1; }
  .t-ctrl .t-x { flex: 0 0 40px; }
  .t-time { font-size: 48px; }
  .sw-open .lbl { display: none; }
}
@media (prefers-reduced-motion: reduce) { .timer.is-done .t-time { animation: none; } .t-prog i { transition: none; } }

.t-pick { display: none; grid-template-columns: minmax(0, 1fr); gap: 10px; padding-block: 12px 14px; }
.timer.is-pick .t-pick { display: grid; }
.timer.is-pick .t-in, .timer.is-pick .t-prog { display: none; }
.t-presets { display: flex; flex-wrap: wrap; gap: 8px; }
