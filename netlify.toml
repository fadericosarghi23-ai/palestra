# starfit+: sito statico con una funzione per gli account, nessuna build.
[build]
  publish = "public"
  command = ""

# Account: una funzione per /api/*, dati salvati in Netlify Blobs (piano gratuito).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Il service worker va sempre ricontrollato, così gli aggiornamenti arrivano subito sul telefono.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Sicurezza di base. Il referrer serve ai video YouTube incorporati.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
